<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Redirecting…</title>
  <script>
    // GitHub Pages SPA redirect trick
    // When GitHub Pages encounters a route it doesn't know (e.g. /admin/login),
    // it serves this 404.html. This script encodes the path into a query param
    // and redirects to index.html, which then restores the original URL via
    // history.replaceState() so Angular Router can handle it.
    var pathSegmentsToKeep = 1; // keep 1 segment for /brave-goodall/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Redirecting&hellip;
</body>
</html>
