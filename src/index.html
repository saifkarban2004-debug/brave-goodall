<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Book Your Transfer | Tourist Transportation</title>
  <meta name="description" content="Book fast, reliable tourist transportation transfers. Available 24/7 — airport pickups, hotel drop-offs, return trips and more."/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#172554"/>
  <!-- Open Graph -->
  <meta property="og:title" content="Book Your Transfer | Tourist Transportation"/>
  <meta property="og:description" content="Fast, reliable tourist transfers available 24/7. Book your ride in seconds."/>
  <meta property="og:type" content="website"/>
  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <base href="/"/>
</head>
<body>
  <!-- GitHub Pages SPA redirect restore (companion to 404.html) -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
  <app-root></app-root>
</body>
</html>
