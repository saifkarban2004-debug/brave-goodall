<div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">

  <!-- ── Brand mark ──────────────────────────────────────────────────────── -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl
                bg-brand-600/20 border border-brand-500/30 mb-4">
      <svg class="w-7 h-7 text-brand-400" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955
             11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29
             9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-white tracking-tight">Admin Access</h1>
    <p class="text-white/40 text-sm mt-1">Tourist Transfers · Staff Only</p>
  </div>

  <!-- ── Login card ──────────────────────────────────────────────────────── -->
  <div class="w-full max-w-sm glass-card p-7">

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

      <!-- ── Email ──────────────────────────────────────────────────────── -->
      <div>
        <label for="login-email" class="form-label">
          Email address
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-white/30" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7
                   a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <input id="login-email"
                 type="email"
                 formControlName="email"
                 autocomplete="username"
                 placeholder="admin@yourdomain.com"
                 class="form-input pl-10"
                 [class.border-red-500]="hasError('email')"/>
        </div>
        <p *ngIf="hasError('email')" class="form-error">
          <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0
                 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"/>
          </svg>
          {{ getError('email') }}
        </p>
      </div>

      <!-- ── Password ───────────────────────────────────────────────────── -->
      <div>
        <label for="login-password" class="form-label">
          Password
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-white/30" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0
                   00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input id="login-password"
                 [type]="showPassword ? 'text' : 'password'"
                 formControlName="password"
                 autocomplete="current-password"
                 placeholder="••••••••"
                 class="form-input pl-10 pr-11"
                 [class.border-red-500]="hasError('password')"/>
          <!-- Show / hide toggle -->
          <button type="button"
                  (click)="showPassword = !showPassword"
                  class="absolute inset-y-0 right-3 flex items-center text-white/30
                         hover:text-white/70 transition-colors duration-150"
                  [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <!-- Eye open -->
            <svg *ngIf="!showPassword" class="w-4.5 h-4.5 w-5 h-5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943
                   9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <!-- Eye closed -->
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943
                   -9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243
                   4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532
                   7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478
                   0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
        <p *ngIf="hasError('password')" class="form-error">
          <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0
                 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"/>
          </svg>
          {{ getError('password') }}
        </p>
      </div>

      <!-- ── Firebase error banner ──────────────────────────────────────── -->
      <div *ngIf="errorMessage"
           class="flex items-start gap-3 p-3.5 rounded-xl
                  bg-red-500/10 border border-red-500/30 animate-fade-in">
        <svg class="w-4.5 h-4.5 w-5 h-5 text-red-400 flex-shrink-0 mt-0.5"
             fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0
               012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"/>
        </svg>
        <p class="text-red-400 text-sm leading-snug">{{ errorMessage }}</p>
      </div>

      <!-- ── Submit button ──────────────────────────────────────────────── -->
      <button id="btn-admin-login"
              type="submit"
              [disabled]="isLoading"
              class="btn-primary flex items-center justify-center gap-2.5 mt-2">

        <!-- Spinner -->
        <svg *ngIf="isLoading" class="animate-spin w-5 h-5 text-white/80"
             fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10"
                  stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>

        <!-- Lock icon -->
        <svg *ngIf="!isLoading" class="w-4.5 h-4.5 w-5 h-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 16v-4m0 0V8m0 4h4m-4 0H7m13 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>

        {{ isLoading ? 'Signing in…' : 'Sign In to Dashboard' }}
      </button>

    </form>

    <!-- ── Footer note ─────────────────────────────────────────────────── -->
    <p class="text-center text-white/20 text-xs mt-6">
      🔒 Restricted area · Staff access only
    </p>
  </div>

  <!-- Back to booking form link -->
  <a href="/" class="mt-6 text-white/30 hover:text-white/60 text-xs
                     transition-colors duration-150 flex items-center gap-1">
    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
    </svg>
    Back to booking form
  </a>

</div>
